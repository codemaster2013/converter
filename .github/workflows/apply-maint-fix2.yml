name: Apply maintenance fix 2 (temporary)

on:
  push:
    paths:
      - '.github/workflows/apply-maint-fix2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-maint-fix2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout converter
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch files with single-line anchors
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, sys

          EDITS = [
            ('sw.js',
             "const CACHE_VERSION = 'v37';",
             "const CACHE_VERSION = 'v38';"),
            ('sw.js',
             ".then((cache) => Promise.allSettled(CORE_ASSETS.map((url) => cache.add(url)))",
             ".then((cache) => Promise.allSettled(CORE_ASSETS.map((url) => cache.add(url))))"),
            ('sw.js',
             "  if (req.mode === 'navigate') {",
             "  if (req.mode === 'navigate') { const isMaint = url.pathname.slice(-17) === '/maintenance.html';"),
            ('sw.js',
             "        .then((res) => { putInCache(CORE_CACHE, req, res); return res; })",
             "        .then((res) => { if (!isMaint) putInCache(CORE_CACHE, req, res); return res; })"),
            ('sw.js',
             "            .then((hit) => hit || caches.match('./index.html'))",
             "            .then((hit) => hit || (isMaint ? caches.match('./maintenance.html') : caches.match('./index.html')))"),

            ('maintenance.html',
             "<!-- Self-heal: when the admin switch goes back to Live, return visitors to the site.",
             "<!-- Switch sync: mirrors the admin switch flag; it NEVER redirects (the guard owns the redirect; a second redirector caused the refresh loop)."),
            ('maintenance.html',
             "          location.replace('./');",
             "          /* NEVER redirect from here: the guard owns the redirect. */"),

            ('pwa.js',
             "      if (here !== 'maintenance.html') {",
             "      if (false) { /* the guard owns the redirect; never redirect from here */"),
            ('pwa.js',
             "        location.replace(dir + 'maintenance.html');",
             "        /* no redirect here: the guard owns it (a second redirector caused the loop) */"),

            ('.github/workflows/deploy-maintenance.yml',
             "grep -q \"CACHE_VERSION = 'v36'\" sw.js && echo \"ok: sw v36\"",
             "grep -q \"CACHE_VERSION = 'v38'\" sw.js && echo \"ok: sw v38\""),
          ]

          for path, old, new in EDITS:
              s = io.open(path, encoding='utf-8').read()
              n = s.count(old)
              if n != 1:
                  sys.exit('FAIL %s: anchor found %d times: %r' % (path, n, old[:80]))
              io.open(path, 'w', encoding='utf-8').write(s.replace(old, new))
              print('patched', path, '::', old[:60])
          PY

      - name: Verify the fix
        run: |
          set -euo pipefail
          node --check mg-maint-guard.js && echo "ok: guard syntax"
          node --check sw.js && echo "ok: sw syntax"
          node --check pwa.js && echo "ok: pwa syntax"
          grep -q "var FORCE_ON = true;" mg-maint-guard.js && echo "ok: FORCE_ON true"
          grep -q "CACHE_VERSION = 'v38'" sw.js && echo "ok: sw v38"
          grep -q "if (here === PAGE || here === 'admin.html') { return; }" mg-maint-guard.js && echo "ok: guard skips maintenance"
          if grep -q "location.replace('./')" maintenance.html; then echo "FAIL: self-heal redirect still present"; exit 1; fi
          echo "ok: no self-heal redirect"
          if grep -q "location.replace(dir + 'maintenance.html')" pwa.js; then echo "FAIL: pwa redirect still present"; exit 1; fi
          echo "ok: no pwa redirect"
          grep -q "isMaint" sw.js && echo "ok: sw maintenance navigate handling"
          for f in index.html "index (3).html" 404.html offline.html; do
            grep -q 'mg-maint-guard.js' "$f" || { echo "MISSING guard in $f"; exit 1; }
          done
          echo "ok: guard present in all entry pages"
          git diff --stat

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "mgp-maintenance-bot"
          git config user.email "mgp-maintenance-bot@users.noreply.github.com"
          git rm -q .github/workflows/apply-maint-fix.yml .github/workflows/apply-maint-fix2.yml
          git add -A
          git commit -q -F - <<'MSG'
          fix(maintenance): loop-free maintenance page + working service worker

          Follow-up to the instant guard. Maintenance stays ON (FORCE_ON = true), no time limit.

          1) REFRESH LOOP
             The maintenance page's own self-heal redirected to './' whenever the
             switch read maintenance=false (it currently does), while the guard
             redirected back to maintenance.html -> infinite reload. Removed the
             redirect from maintenance.html (it now only mirrors the flag) and
             disabled the duplicate redirect in pwa.js. The guard already skips
             maintenance.html/admin.html.

          2) SERVICE WORKER
             sw.js had a syntax error (unbalanced parens in the install handler),
             so the worker never installed and CACHE_VERSION bumps had no effect.
             Fixed, bumped CACHE_VERSION to v38, and made the maintenance page never
             be served from cache (and never fall back to a cached live page).

          Frozen design untouched. No time limit. Maintenance is lifted only by the admin.
          MSG
          git push origin HEAD:main
          echo "pushed: $(git rev-parse HEAD)"
