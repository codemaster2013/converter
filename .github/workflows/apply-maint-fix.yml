name: Apply maintenance fix (temporary)

on:
  push:
    paths:
      - '.github/workflows/apply-maint-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-maint-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout converter
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the new guard
        run: |
          set -euo pipefail
          cat > mg-maint-guard.js <<'GUARD'
          /* ============================================================================
             MediaGrabber Pro — maintenance guard  (v2 — instant, loop-free)
             ----------------------------------------------------------------------------
             Loaded in <head> of every entry page, BEFORE the app shell and BEFORE the
             Superpass / checkout paywall. Its only job: if maintenance is ON, send the
             visitor to maintenance.html instead of letting them reach the app or a
             checkout flow.

             WHY v2  (INCIDENT 2026-11-08 follow-up)
             ---------------------------------------
             v1 decided maintenance ASYNCHRONOUSLY: it waited for a Supabase fetch before
             redirecting, so on a first visit (or after the flag had been cleared) the
             visitor sat on the live site for as long as the network took — minutes when
             Supabase was slow or unreachable. That is the "many minutes" window.

             v2 makes the decision SYNCHRONOUS and INSTANT:

               1. FORCE_ON (baked into this file) -> redirect immediately, before any
                  network call and before the body is parsed. No fetch on the critical
                  path. This is the incident state: maintenance is ON with no time limit.
               2. Otherwise, a locally remembered flag (localStorage) -> redirect
                  immediately, still with no network call.
               3. The Supabase switch is consulted ONLY in the background, and ONLY when
                  FORCE_ON is false, to refresh the remembered flag for the next visit.
                  It is never on the critical path.

             The guard never runs on maintenance.html (or admin.html), so it can never
             bounce a visitor back and forth with the maintenance page's own self-heal —
             that fight was the refresh loop.

             Failure policy: if the switch cannot be reached, the guard does NOTHING.
             A network hiccup must never invent a maintenance screen, and must never
             surface an error to the visitor.
             ========================================================================== */
          (function () {
            'use strict';

            var SB_URL = 'https://vbawjzscjjakqlomqqpr.supabase.co';
            var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZiYXdqenNjampha3Fsb21xcXByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MTM3MDAsImV4cCI6MjEwODk4OTcwMH0.I869HC183sDYPcSZQZmMeFcGkOSb0hz54zWCLGAu0Co';

            var FLAG = 'mg_maint';
            var PAGE = 'maintenance.html';

            /* INCIDENT 2026-11-08: the Supabase switch row was tampered with (its message
               field was defaced and maintenance was left OFF). Until the admin restores
               the switch, force the maintenance screen ON for every visitor, instantly.
               Set this back to false to return to switch-driven control. */
            var FORCE_ON = true;

            /* Never guard the maintenance page itself (it has its own self-heal) and never
               guard the admin console. This is what stops the refresh loop. */
            var here = String(location.pathname).split('/').pop().toLowerCase();
            if (here === PAGE || here === 'admin.html') { return; }

            /* Resolve the site root so this works at /converter/ and at a domain root. */
            function root() {
              var p = location.pathname;
              var i = p.lastIndexOf('/');
              return p.slice(0, i + 1) || '/';
            }

            /* Keep a requested tool (?tool=...) but never carry the QA preview switch. */
            function search() {
              var s = location.search || '';
              if (!s) { return ''; }
              try {
                var q = new URLSearchParams(s);
                q.delete('preview');
                var out = q.toString();
                return out ? '?' + out : '';
              } catch (e) { return ''; }
            }

            function go() {
              try { location.replace(root() + PAGE + search()); }
              catch (e) { location.replace(root() + PAGE); }
            }

            /* ---- 1. INSTANT: forced on (incident state) ----------------------------- */
            if (FORCE_ON) { go(); return; }

            /* ---- 2. INSTANT: remembered on (no network) ----------------------------- */
            var remembered = false;
            try { remembered = localStorage.getItem(FLAG) === '1'; } catch (e) {}
            if (remembered) { go(); return; }

            /* ---- 3. BACKGROUND only: refresh the remembered flag for the next visit -- */
            try {
              fetch(SB_URL + '/rest/v1/site_settings?id=eq.1&select=maintenance', {
                headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON },
                cache: 'no-store',
                credentials: 'omit',
                referrerPolicy: 'no-referrer',
                mode: 'cors'
              })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (rows) {
                  var row = rows && rows[0];
                  if (!row) { return; }                       /* unknown -> do nothing */
                  if (row.maintenance === true) {
                    try { localStorage.setItem(FLAG, '1'); } catch (e) {}
                    go();
                  } else if (row.maintenance === false) {
                    try { localStorage.removeItem(FLAG); } catch (e) {}
                  }
                })
                .catch(function () { /* unreachable -> stay on the live site */ });
            } catch (e) { /* no fetch -> stay on the live site */ }
          })();
          GUARD
          # strip the 10-space YAML indentation the heredoc body picked up
          python3 - <<'PY'
          import re
          p = 'mg-maint-guard.js'
          s = open(p, encoding='utf-8').read()
          s = '\n'.join(l[10:] if l.startswith(' ' * 10) else l for l in s.split('\n'))
          open(p, 'w', encoding='utf-8').write(s)
          print('guard bytes:', len(s.encode()))
          PY

      - name: Patch sw.js, maintenance.html, pwa.js, workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, sys

          def edit(path, pairs):
              s = io.open(path, encoding='utf-8').read()
              for old, new in pairs:
                  n = s.count(old)
                  if n != 1:
                      sys.exit('FAIL %s: anchor found %d times: %r' % (path, n, old[:70]))
                  s = s.replace(old, new)
              io.open(path, 'w', encoding='utf-8').write(s)
              print('patched', path)

          # ---- sw.js -------------------------------------------------------------
          edit('sw.js', [
              ("const CACHE_VERSION = 'v37';", "const CACHE_VERSION = 'v38';"),
              (".then((cache) => Promise.allSettled(CORE_ASSETS.map((url) => cache.add(url)))",
               ".then((cache) => Promise.allSettled(CORE_ASSETS.map((url) => cache.add(url))))"),
              ("""  if (req.mode === 'navigate') {
              event.respondWith(
                fetch(req)
                  .then((res) => { putInCache(CORE_CACHE, req, res); return res; })
                  .catch(() =>
                    caches.match(req, { ignoreSearch: true })
                      .then((hit) => hit || caches.match('./index.html'))
                      .then((hit) => hit || caches.match('./offline.html'))
                  )
              );
              return;
            }""",
               """  if (req.mode === 'navigate') {
              // The maintenance screen must never be served from cache and must never be
              // replaced by a cached live page: always go to the network, and if the
              // network is down fall back to the cached maintenance page itself (never to
              // index.html, which would re-trigger the guard and loop).
              const isMaint = /\\/maintenance\\.html$/i.test(url.pathname);
              event.respondWith(
                fetch(req)
                  .then((res) => { if (!isMaint) putInCache(CORE_CACHE, req, res); return res; })
                  .catch(() =>
                    caches.match(req, { ignoreSearch: true })
                      .then((hit) => hit || (isMaint ? caches.match('./maintenance.html') : caches.match('./index.html')))
                      .then((hit) => hit || caches.match('./offline.html'))
                  )
              );
              return;
            }"""),
          ])

          # ---- maintenance.html --------------------------------------------------
          edit('maintenance.html', [
              ("""<!-- Self-heal: when the admin switch goes back to Live, return visitors to the site.
                   Never shows an error; if the switch is unreachable it simply stays on this page. -->""",
               """<!-- Switch sync: keeps the remembered flag in step with the admin switch.
                   It NEVER redirects from this page — the guard owns the redirect, and a
                   second redirector racing the guard is what produced the refresh loop.
                   Maintenance is lifted only by the admin (FORCE_ON = false in mg-maint-guard.js).
                   Never shows an error; if the switch is unreachable it simply stays on this page. -->"""),
              ("""        if (row.maintenance === false) {
                  try { localStorage.removeItem(FLAG); } catch (e) {}
                  location.replace('./');
                }""",
               """        if (row.maintenance === false) {
                  /* Keep the remembered flag in sync, but NEVER redirect from here.
                     Redirecting from the maintenance page is what produced the refresh
                     loop. The guard decides; this page only mirrors the flag. */
                  try { localStorage.removeItem(FLAG); } catch (e) {}
                }"""),
          ])

          # ---- pwa.js ------------------------------------------------------------
          edit('pwa.js', [
              ("""    /* The frozen maintenance screen is the single visitor-facing experience.
                   Hand off to it instead of painting the legacy overlay, so every page
                   that loads pwa.js (app, VIP/checkout, tools) shows the same screen. */
                try {
                  var here = String(location.pathname).split('/').pop().toLowerCase();
                  if (here !== 'maintenance.html') {
                    var dir = location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1) || '/';
                    location.replace(dir + 'maintenance.html');
                    return;
                  }
                } catch (e) {}""",
               """    /* The frozen maintenance screen is the single visitor-facing experience.
                   The pre-paywall guard (mg-maint-guard.js) already sends every entry page
                   to maintenance.html synchronously, so this overlay must NOT redirect:
                   a second redirector racing the guard is what produced the refresh loop.
                   If we ever get here, just paint the overlay in place. */"""),
          ])

          # ---- deploy workflow ---------------------------------------------------
          edit('.github/workflows/deploy-maintenance.yml', [
              ("""grep -q "CACHE_VERSION = 'v36'" sw.js && echo "ok: sw v36\"""",
               """grep -q "CACHE_VERSION = 'v38'" sw.js && echo "ok: sw v38\""""),
          ])
          PY

      - name: Verify the fix
        run: |
          set -euo pipefail
          node --check mg-maint-guard.js && echo "ok: guard syntax"
          node --check sw.js && echo "ok: sw syntax"
          node --check pwa.js && echo "ok: pwa syntax"
          grep -q "var FORCE_ON = true;" mg-maint-guard.js && echo "ok: FORCE_ON true"
          grep -q "CACHE_VERSION = 'v38'" sw.js && echo "ok: sw v38"
          grep -q "if (here === PAGE || here === 'admin.html') { return; }" mg-maint-guard.js && echo "ok: guard skips maintenance"
          if grep -q "location.replace('./')" maintenance.html; then echo "FAIL: self-heal redirect still present"; exit 1; fi
          echo "ok: no self-heal redirect"
          if grep -q "location.replace(dir + 'maintenance.html')" pwa.js; then echo "FAIL: pwa redirect still present"; exit 1; fi
          echo "ok: no pwa redirect"
          for f in index.html "index (3).html" 404.html offline.html; do
            grep -q 'mg-maint-guard.js' "$f" || { echo "MISSING guard in $f"; exit 1; }
          done
          echo "ok: guard present in all entry pages"
          git diff --stat

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "mgp-maintenance-bot"
          git config user.email "mgp-maintenance-bot@users.noreply.github.com"
          git add -A
          git commit -q -F - <<'MSG'
          fix(maintenance): instant, loop-free maintenance guard (INCIDENT 2026-11-08)

          Two visitor-facing defects fixed; maintenance stays ON (FORCE_ON = true), no time limit.

          1) SLOW (many minutes before the screen appeared)
             mg-maint-guard.js decided maintenance ASYNCHRONOUSLY: it waited on a
             Supabase fetch before redirecting, so a first visit (or one after the
             flag had been cleared) sat on the live site for as long as the network
             took. The decision is now SYNCHRONOUS: FORCE_ON -> redirect immediately,
             before any network call and before the body is parsed; otherwise a
             locally remembered flag -> redirect immediately. Supabase is consulted
             only in the background (and only when FORCE_ON is false) to refresh the
             flag for the next visit.

          2) REFRESH LOOP
             The maintenance page's own self-heal redirected to './' whenever the
             switch read maintenance=false (it currently does), while the guard
             redirected back to maintenance.html -> infinite reload. Removed the
             redirect from maintenance.html (it now only mirrors the flag) and
             removed the duplicate redirect from pwa.js. The guard already skips
             maintenance.html/admin.html.

          3) SERVICE WORKER
             sw.js had a syntax error (unbalanced parens in the install handler),
             so the worker never installed and CACHE_VERSION bumps had no effect.
             Fixed, bumped CACHE_VERSION to v38, and made the maintenance page never
             be served from cache (and never fall back to a cached live page).

          Frozen design untouched. No time limit. Maintenance is lifted only by the admin.
          MSG
          git push origin HEAD:main
          echo "pushed: $(git rev-parse HEAD)"
