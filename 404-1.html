    {n:'OCR – Image to Text', d:'Extract text from images & scans',     i:'txt', f:'ocr-image-to-text.html',        v:'ocr', tags:['image','text','ocr'],
      w:['ocr','image to text','extract text','text extractor','scan to text','smart ocr','ocr tool','pdf to text','ocr converter']},
    {n:'HEIC to JPG',      d:'Convert iPhone photos to JPG',            i:'img', f:'heic-to-jpg.html',              tags:['image','heic'],
      w:['heic to jpg','heic converter','heif to jpg','iphone photo to jpg','heic2jpg','heic']},
    {n:'Passport Photo Maker', d:'Exam & passport photo and signature size', i:'id', f:'passport-size-photo-maker.html', tags:['image','photo'],
      w:['passport size photo','passport photo','photo and signature size','signature size','exam photo size','photoprep']},
    {n:'Remove Photo GPS / EXIF', d:'Strip location and metadata',      i:'pin', f:'remove-exif-gps-from-photo.html', tags:['image','photo','exif'],
      w:['remove exif','remove gps from photo','remove photo location','strip metadata','remove photo metadata','exif']},
    {n:'QR Code Generator',d:'Create QR codes for links & text',        i:'qr',  f:'qr-code-generator.html',        tags:['qr'],
      w:['qr code generator','qr generator','make qr code','qrcode']},
    {n:'QR Code Scanner',  d:'Scan QR codes from camera or image',      i:'qr',  f:'qr-code-scanner.html',          tags:['qr','scan'],
      w:['qr code scanner','qr scanner','scan qr code','qrscan']},
    {n:'Base64 Converter', d:'Encode / decode text and images',         i:'code',f:'base64-converter.html',         v:'base64', tags:['image','text','code'],
      w:['base64 converter','base64 encoder','base64 decoder','image to base64','base64 to image','binary converter','text to binary','base64']},
    {n:'Color Palette Extractor', d:'Pull dominant colors from any image', i:'pal', v:'palette', tags:['image','color'],
      w:['color palette','colour palette','color palette extractor','extract colors','dominant colors','hex color picker','image colors','palette']},
    {n:'Image Metadata Inspector', d:'View EXIF and hidden image info', i:'info', v:'meta', tags:['image','exif'],
      w:['metadata inspector','image metadata','image info','exif viewer','metadata']}
  ];
  var ALIAS = {pdf:['pdf'],image:['image','img','photo','picture','jpg','jpeg','png','webp'],convert:['convert','conver'],merge:['merge','combine','join'],
    scan:['scan'],document:['document','doc'],page:['page'],sign:['sign'],password:['password','unlock','decrypt'],read:['read','view'],
    compress:['compress','reduce','shrink','size'],resize:['resize'],text:['text','txt'],ocr:['ocr'],heic:['heic','heif','iphone'],
    exif:['exif','gps','meta','location'],qr:['qr'],code:['base64','binary','encode','decode'],color:['color','colour','hex','palette']};

  function compact(x){return String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
  function bigr(x){var o={};for(var i=0;i<x.length-1;i++){var g=x.substr(i,2);o[g]=(o[g]||0)+1}return o}
  function dice(a,b){if(a.length<2||b.length<2)return 0;var A=bigr(a),B=bigr(b),n=0;for(var k in A)if(B[k])n+=Math.min(A[k],B[k]);return 2*n/(a.length+b.length-2)}

  // what did the visitor type? drop the site folder and "index.html" noise
  var parts = decodeURIComponent(location.pathname).split('/').filter(Boolean);
  var baseSeg = (window.MG_BASE||'/').replace(/\//g,'');
  var typedParts = parts.filter(function(p,i){
    var c=compact(p);
    return c && c!=='indexhtml' && c!=='indexhtm' && c!=='index' && c!=='html' && c!=='htm' && c!=='404' && !(i===0 && baseSeg && c===compact(baseSeg)) && !/^index\d*$/.test(c);
  }).map(function(p){return p.replace(/\.html?$/i,'')});
  var raw = typedParts.join(' ');
  var C = compact(raw);
  var wantsVip = /vip|premium|elite|\bpro\b/i.test(decodeURIComponent(location.pathname));

  function has(tag){return (ALIAS[tag]||[tag]).some(function(a){return C.indexOf(a)>-1})}
  function score(t){
    var s=0;
    t.w.forEach(function(w){
      var cw=compact(w);
      if(cw===C && C.length>=3){ s=Math.max(s,13); return; }
      if(cw.length<4) return;
      if(C.indexOf(cw)>-1) s=Math.max(s,10+cw.length*.3);
      else if(C.length>=4 && cw.indexOf(C)>-1) s=Math.max(s,8);
      else { var d=dice(C,cw); if(d>.55) s=Math.max(s,d*9); }
    });
    t.tags.forEach(function(g){ if(has(g)) s+=(g==='pdf'?2.6:1.6); });
    return s;
  }

  // one entry per way of opening a tool: free page and/or VIP
  var entries=[];
  CAT.forEach(function(t,idx){
    var sc = C ? score(t) : 0;
    if(t.f) entries.push({t:t,vip:false,s:sc-.01*idx-(t.v?0:0)});
    if(t.v) entries.push({t:t,vip:true, s:sc+(t.f?-.005:(sc>=8?.5:0))-.01*idx+(wantsVip?3:0)});
  });
  entries.sort(function(a,b){return b.s-a.s});

  var title='Maybe you were looking for', sub='';
  var pick;
  if(!C || entries[0].s<1.5){
    pick=['jpg','conv','vip'].map(function(k){
      return entries.filter(function(e){
        return k==='jpg'?(e.t.f==='jpg-to-pdf.html'&&!e.vip):k==='conv'?(e.t.f==='image-converter.html'&&!e.vip):(e.t.v==='pdf'&&e.vip);
      })[0];
    });
    title='Popular tools'; sub=C?'We couldn\u2019t find an exact match for ':'';
  } else {
    pick=entries.slice(0,3);
    // if a VIP tool matches well but didn't make the cut, give it the last slot
    if(!pick.some(function(e){return e.vip})){
      var v=entries.filter(function(e){return e.vip && e.s>=Math.max(2.5,entries[0].s*.5)})[0];
      if(v) pick[2]=v;
    }
    sub='Closest matches for ';
  }
  if(C) {
    var sm=document.getElementById('sugSub'); sm.textContent=sub; var em=document.createElement('em'); em.textContent=raw.length>34?raw.slice(0,34)+'\u2026':raw; sm.appendChild(em);
  }
  document.getElementById('sugTitle').textContent=title;

  var CROWN='<svg viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>';
  var ARROW='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var overlay=document.getElementById('vipgo'), box=document.getElementById('list');
  pick.forEach(function(e,i){
    if(!e) return;
    var t=e.t, a=document.createElement('a');
    a.className='opt'+(e.vip?' vip':'');
    a.href = e.vip ? VIP_PAGE+'?tool='+encodeURIComponent(t.v)+'#'+encodeURIComponent(t.v) : t.f;
    a.style.animationDelay=(1.45+i*.13)+'s'+(e.vip?',0s':'');
    a.innerHTML='<span class="ic"><svg viewBox="0 0 24 24">'+ICON[t.i]+'</svg></span>'+
      '<span class="tx"><span class="tt"><span class="nm"></span><span class="pill '+(e.vip?'vip':'free')+'">'+(e.vip?CROWN+'VIP':'Free')+'</span></span><span class="ds"></span></span>'+
      '<span class="ar">'+ARROW+'</span>';
    a.querySelector('.nm').textContent=t.n;
    a.querySelector('.ds').textContent=(e.vip&&t.vd)?t.vd:(e.vip&&t.f?t.d+' \u00b7 opens in VIP':t.d+(e.vip?' \u00b7 VIP exclusive':''));
    if(e.vip){
      a.addEventListener('click',function(ev){
        if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button===1) return;
        ev.preventDefault(); overlay.classList.add('on');
        setTimeout(function(){location.href=a.href},650);
      });
    }
    box.appendChild(a);
  });
  document.getElementById('sug').style.display='block';
})();
</script>
